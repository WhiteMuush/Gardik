# Local development database. Not for production.
services:
  db:
    image: postgres:16
    container_name: datashield-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-datashield}
    ports:
      - "5432:5432"
    volumes:
      - datashield-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-datashield}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  datashield-db-data:
