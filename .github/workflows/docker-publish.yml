name: Docker image

# Publishes the production image to Docker Hub and to GitHub Container Registry.
# Tagged releases produce the versioned tags plus `latest`; a manual run
# publishes `edge` so an image can be built from a branch without cutting a
# release. GHCR is what the repository's Packages list shows: without it, the
# image looks absent to anyone looking for it from GitHub.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    # Gated environment: the job waits for a manual approval before anything is
    # pushed publicly, and it is where the Docker Hub credentials live.
    environment: dockerhub
    timeout-minutes: 45
    permissions:
      contents: read
      # GHCR authenticates with GITHUB_TOKEN, so it needs no secret in the environment.
      packages: write
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'whitemuush/gardik' }}
      # Spelled out rather than built from github.repository, which keeps the
      # owner's capitals and GHCR only accepts lowercase names.
      GHCR_IMAGE: ${{ vars.GHCR_IMAGE || 'ghcr.io/whitemuush/gardik' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One build, one scan, one push: every tag below lands on both registries.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          # Add linux/arm64 here once the extra emulated build time is
          # acceptable: a QEMU arm64 `next build` roughly triples the run.
          platforms: linux/amd64
          # Loaded into the local daemon instead of pushed, so the scan below
          # gets to veto a release before anything reaches Docker Hub.
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No GHA cache: GitHub scopes it to the tag ref, so a release could never read the previous one.

      - name: Install Trivy
        uses: ./.github/actions/install-trivy

      # Scanning before the push is the whole point: a scan that runs after it
      # only tells us a vulnerable image is already public. `ignore-unfixed`
      # keeps the gate on findings that can actually be acted on, otherwise a
      # base-image CVE with no upstream patch blocks every release.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Outside the workspace, a database download would change the build context the push step sees.
          cache-dir: ${{ runner.temp }}/trivy
          cache: "false"
          skip-setup-trivy: true

      # The builder still holds every layer from the build step, so this re-runs in seconds.
      - name: Push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The SBOM is a separate attestation manifest, so the image layers stay those that were scanned.
          sbom: true

      # A rebuilt layer in the push step would mean a registry serves an image Trivy never scanned.
      - name: Check the pushed images are the scanned one
        env:
          SCANNED_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          VERSION: ${{ steps.meta.outputs.version }}
        # Layer digests, not the image ID, which the containerd store sets to the pulled index digest.
        # Read before any pull, since a pull retags the local image it replaces.
        run: |
          scanned=$(docker image inspect --format '{{json .RootFS.Layers}}' "$SCANNED_IMAGE")
          for image in "$DOCKERHUB_IMAGE:$VERSION" "$GHCR_IMAGE:$VERSION"; do
            docker pull --quiet --platform linux/amd64 "$image" > /dev/null
            pushed=$(docker image inspect --format '{{json .RootFS.Layers}}' "$image")
            if [ "$scanned" != "$pushed" ]; then
              echo "::error::the layers pushed as $image differ from the layers Trivy scanned"
              exit 1
            fi
          done

      # The Docker Hub page has its own audience (operators deploying the
      # image), hence its own README. Never fatal: a description that fails to
      # sync must not fail a publish that already pushed the image.
      - name: Sync the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: "Self-hosted breach exposure monitoring for your employees' credentials"
          readme-filepath: ./docker/README.hub.md
