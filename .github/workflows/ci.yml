name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default for every job in this workflow.
permissions:
  contents: read

# A newer push on the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (lint, types, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy value so loading prisma.config.ts never fails on a missing var.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings allowed)
        run: npm run lint -- --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy value so loading prisma.config.ts never fails on a missing var.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build must never depend on real secrets.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECTORY_ENCRYPTION_KEY: ci-placeholder-encryption-key-32-chars-minimum
      AUTH_SECRET: ci-placeholder-auth-secret
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  integration:
    name: Integration (DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: datashield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d datashield"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/datashield
      # Placeholders, same shape as the build and e2e jobs. The integration
      # suite writes SsoProvider rows, and the Prisma extension that seals
      # oidcConfig refuses to run without a key, so the suite cannot start
      # without one. Never a real secret: it only ever encrypts throwaway rows
      # in a database this job creates and discards.
      DIRECTORY_ENCRYPTION_KEY: ci-placeholder-encryption-key-32-chars-minimum
      AUTH_SECRET: ci-placeholder-auth-secret
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed admin account
        run: npx tsx prisma/seed.ts

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: datashield
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d datashield"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/datashield
      AUTH_SECRET: ci-placeholder-auth-secret
      AUTH_URL: http://localhost:3000
      DIRECTORY_ENCRYPTION_KEY: ci-placeholder-encryption-key-32-chars-minimum
      # Disables Better Auth's sign-in rate limit (3 per 10s) for the e2e run
      # only. The serial 2FA suite makes several sign-ins within that window, so
      # without this it 429-flakes and leans on retries. The app only honours
      # this when AUTH_URL is loopback (see src/lib/auth/server.ts), so it stays
      # inert in prod even if this var leaks there.
      E2E: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed admin account
        run: npx tsx prisma/seed.ts

      - name: Seed e2e fixtures
        run: npx tsx e2e/seed.ts

      - name: Build
        run: npm run build

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npx playwright test

  # Aggregate gate required by the main branch protection rule.
  # Reports the "ci" status check, green only when all gates pass.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [quality, test, build, integration, e2e]
    steps:
      - run: echo "Quality, test, build, integration and e2e gates passed."
