name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Least privilege by default for every job in this workflow.
permissions:
  contents: read

# A newer push on the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (npm run check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy value so loading prisma.config.ts never fails on a missing var.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      # Full history: gitleaks scans every commit and the branch checks need origin/develop.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: true

      # Same command as the pre-push hook, so local and CI cannot drift.
      - name: Every quality gate
        run: npm run check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders: the build must never depend on real secrets.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECTORY_ENCRYPTION_KEY: ci-placeholder-encryption-key-32-chars-minimum
      BETTER_AUTH_SECRET: ci-placeholder-auth-secret
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # Only pushes to develop and main store an entry (about 160 MB), pull requests read it from their base branch.
      - name: Save the Next.js build cache
        if: github.event_name == 'push' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

  integration:
    # Run the suite twice, against a UTC database and against one provisioned in
    # a regional timezone. Everything Prisma writes is UTC wall-clock digits, so
    # any raw SQL that compares such a column against now() silently changes
    # meaning with the session timezone. A UTC-only job cannot see that class of
    # bug: the offset is zero and the fault is invisible.
    name: Integration (DB, ${{ matrix.timezone }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Europe/Paris]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gardik
          # initdb reads TZ, so the cluster comes up in this timezone the way a
          # managed instance provisioned in a region would.
          TZ: ${{ matrix.timezone }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gardik"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gardik
      # Placeholders, same shape as the build and e2e jobs. The integration
      # suite writes SsoProvider rows, and the Prisma extension that seals
      # oidcConfig refuses to run without a key, so the suite cannot start
      # without one. Never a real secret: it only ever encrypts throwaway rows
      # in a database this job creates and discards.
      DIRECTORY_ENCRYPTION_KEY: ci-placeholder-encryption-key-32-chars-minimum
      BETTER_AUTH_SECRET: ci-placeholder-auth-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed admin account
        run: npx tsx prisma/seed.ts

      - name: Integration tests
        run: npm run test:integration

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gardik
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gardik"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gardik
      BETTER_AUTH_SECRET: ci-placeholder-auth-secret
      BETTER_AUTH_URL: http://localhost:3000
      DIRECTORY_ENCRYPTION_KEY: ci-placeholder-encryption-key-32-chars-minimum
      # Disables Better Auth's sign-in rate limit (3 per 10s) for the e2e run
      # only. The serial 2FA suite makes several sign-ins within that window, so
      # without this it 429-flakes and leans on retries. The app only honours
      # this when the base URL is loopback (see src/lib/auth/server.ts), so it stays
      # inert in prod even if this var leaks there.
      E2E: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed admin account
        run: npx tsx prisma/seed.ts

      - name: Seed e2e fixtures
        run: npx tsx e2e/seed.ts

      # Read only: the build job stores the entry for both.
      - name: Restore the Next.js build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npx playwright test

  # Required check of the protect-main-develop ruleset, it runs even when a gate fails because a skipped job counts as passed.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [quality, build, integration, e2e]
    if: ${{ !cancelled() }}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a gate ended with: $result ($RESULTS)"
              exit 1
            fi
          done
          echo "Quality, build, integration and e2e gates passed."
