name: Compliance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Resolve PR range
        id: range
        run: |
          git fetch --no-tags --depth=200 origin "${{ github.event.pull_request.base.ref }}"
          base="$(git merge-base FETCH_HEAD HEAD)"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Validate PR title
        run: |
          printf '%s\n' "${{ github.event.pull_request.title }}" > /tmp/msg.txt
          sh .githooks/lib/check-commit-msg.sh /tmp/msg.txt

      - name: Run content and dependency checks
        run: |
          base="${{ steps.range.outputs.base }}"
          sh .githooks/lib/added-lines.sh range "$base" > /tmp/added.txt
          git diff --name-only --diff-filter=ACMR "$base..HEAD" > /tmp/changed.txt
          xargs -a /tmp/changed.txt -d '\n' \
            sh .githooks/lib/run-all.sh "$base:package.json" "HEAD:package.json" /tmp/added.txt --

  codeowners:
    name: codeowners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify CODEOWNERS contains @WhiteMuush
        run: |
          if ! grep -qF '@WhiteMuush' .github/CODEOWNERS; then
            echo "CODEOWNERS must contain @WhiteMuush. PR blocked."
            exit 1
          fi
