name: Install Trivy
description: Installs the pinned Trivy release after checking its SHA-256.
# The single place for the Trivy version, shared by CI, the release scan and the daily image scan.
runs:
  using: composite
  steps:
    # A direct download skips the tag lookup of setup-trivy, which fails now and then on shared runners.
    - name: Download and verify Trivy
      shell: bash
      env:
        # Bump both together, the checksum is the Linux-64bit line of trivy_<version>_checksums.txt in the release.
        TRIVY_VERSION: 0.76.1
        TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      # The archive goes to RUNNER_TEMP so it never lands in the Docker build context of the workspace.
      run: |
        curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/trivy.tar.gz" \
          "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
        echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
        sudo tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C /usr/local/bin trivy
        trivy --version
